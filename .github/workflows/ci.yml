name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Postgres, Keycloak and Mailpit come from the dev compose file, so CI runs the
# same services and realm as `make up`. Only the app itself runs outside compose.
env:
  COMPOSE: docker compose -f deploy/compose/docker-compose.yml

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then echo "needs gofmt:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - uses: dominikh/staticcheck-action@v1.4.1
        with:
          version: 2026.2.2
          install-go: false
      - name: TypeScript
        working-directory: web
        run: npm ci && npm run typecheck

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Start Postgres, Keycloak and Mailpit
        run: $COMPOSE up -d --wait postgres keycloak mailpit
      - name: Go tests (race detector)
        run: make test GO=go
        env:
          GOFLAGS: -race
      - name: Service logs
        if: failure()
        run: $COMPOSE logs --no-color

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Start Postgres, Keycloak and Mailpit
        run: $COMPOSE up -d --wait postgres keycloak mailpit
      - name: Build web app and binary
        run: make build GO=go
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Playwright
        run: make e2e GO=go
      - name: Service logs
        if: failure()
        run: $COMPOSE logs --no-color
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7

  # Lints the chart, then installs it into kind twice: against a plain Postgres
  # (pre-install migration hook) and with CloudNativePG (post-install hook).
  helm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CHART: deploy/helm/oh-my-story
      # Release "oms" in namespace $ns; the image is loaded into kind, not pulled.
      INSTALL: >-
        --set image.repository=oh-my-story --set image.tag=ci --set image.pullPolicy=Never
        --set replicaCount=1 --wait --timeout 8m
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.15.4
      - name: Lint
        run: for f in $CHART/ci/*.yaml; do helm lint --strict $CHART -f "$f"; done
      - uses: helm/kind-action@v1.12.0
      - name: Build and load image
        run: |
          docker build -t oh-my-story:ci .
          kind load docker-image oh-my-story:ci --name chart-testing
      - name: Install against external Postgres
        run: |
          ns=ext
          kubectl create namespace $ns
          kubectl -n $ns run postgres --image=postgres:16-alpine --port=5432 --expose \
            --env=POSTGRES_USER=oms --env=POSTGRES_PASSWORD=oms --env=POSTGRES_DB=oms
          helm install oms $CHART -n $ns $INSTALL --set baseURL=http://story.local \
            --set database.url='postgres://oms:oms@postgres:5432/oms?sslmode=disable'
          # Upgrade too, so the pre-upgrade migration hook runs (as a no-op).
          helm upgrade oms $CHART -n $ns $INSTALL --reuse-values
          ./.github/check-release.sh $ns
      - name: Install with CloudNativePG
        run: |
          ns=cnpg
          kubectl apply --server-side -f https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.27/releases/cnpg-1.27.0.yaml
          kubectl -n cnpg-system rollout status deployment/cnpg-controller-manager --timeout=3m
          kubectl create namespace $ns
          helm install oms $CHART -n $ns $INSTALL -f $CHART/ci/cnpg-values.yaml
          ./.github/check-release.sh $ns
      - name: Cluster state
        if: failure()
        run: |
          kubectl get all,secrets,events -A
          for ns in ext cnpg; do kubectl -n $ns logs -l app.kubernetes.io/name=oh-my-story --all-containers --tail=100 || true; done

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build container image
        run: docker build -t oh-my-story:ci .
      # With no database configured, serve should start and refuse cleanly.
      - name: Binary runs in the image
        run: |
          out=$(docker run --rm oh-my-story:ci 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "OMS_DATABASE_URL is required"
