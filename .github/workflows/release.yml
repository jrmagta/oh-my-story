name: Release

# Pushing a tag vX.Y.Z publishes the image ghcr.io/<owner>/oh-my-story:X.Y.Z
# (also X.Y and latest) and the Helm chart oci://ghcr.io/<owner>/charts/oh-my-story
# at version X.Y.Z, whose appVersion, and so its default image tag, is X.Y.Z.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/oh-my-story
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: latest=true
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    runs-on: ubuntu-latest
    # The chart's default image tag must exist before the chart is published.
    needs: image
    env:
      CHART: deploy/helm/oh-my-story
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4.3.0
      - name: Lint
        run: for f in $CHART/ci/*.yaml; do helm lint --strict $CHART -f "$f"; done
      - name: Package
        run: |
          version=${GITHUB_REF_NAME#v}
          helm package $CHART --version "$version" --app-version "$version" -d dist
      - name: Push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          echo "$TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push dist/oh-my-story-*.tgz "oci://ghcr.io/$owner/charts"
