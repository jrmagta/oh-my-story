{{- $data := include "oms.secretData" . | trim }}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oms.fullname" . }}
  labels:
    {{- include "oms.labels" . | nindent 4 }}
  annotations:
    # A hook so it exists before the pre-install migration Job. Helm does not
    # delete hook resources on uninstall.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
data:
  {{- $data | nindent 2 }}
{{- end }}
