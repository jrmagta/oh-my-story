{{- if .Values.ingress.enabled }}
{{- $host := .Values.ingress.host | default (urlParse (required "baseURL is required" .Values.baseURL)).hostname }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "oms.fullname" . }}
  labels:
    {{- include "oms.labels" . | nindent 4 }}
  {{- $body := dict "nginx.ingress.kubernetes.io/proxy-body-size" (printf "%dm" (mul (include "oms.attachmentMaxMB" . | int) 2)) }}
  annotations:
    {{- toYaml (merge (deepCopy (.Values.ingress.annotations | default dict)) $body) | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ $host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls" (include "oms.fullname" .)) }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "oms.fullname" . }}
                port:
                  name: http
{{- end }}
