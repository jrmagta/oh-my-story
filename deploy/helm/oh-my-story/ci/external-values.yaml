baseURL: https://story.example.com
database:
  url: postgres://oms:oms@postgres.example.com:5432/oms?sslmode=require
smtp:
  addr: smtp.example.com:587
  username: oms
  password: smtp-secret
  from: oh-my-story <no-reply@example.com>
oidc:
  issuer: https://sso.example.com/realms/oms
  clientID: oh-my-story
  clientSecret: oidc-secret
  name: Example SSO
attachments:
  maxMB: 25
ingress:
  enabled: true
  className: nginx
  tls:
    enabled: true
autoscaling:
  enabled: true
