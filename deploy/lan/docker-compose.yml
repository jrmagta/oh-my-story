name: oh-my-story-lan

# A try-out deployment for a home network, separate from the dev stack: its
# own database volume, built from the working tree. Run it with `make lan`.
#
#   app      127.0.0.1:8090, reached on the LAN at OMS_BASE_URL through a
#            reverse proxy or port forward
#   mailpit  127.0.0.1:8026, where invite emails land (not exposed to the LAN:
#            invite links are credentials)
#
# OMS_BASE_URL must be the address people type, e.g. http://story.example.home;
# the server refuses writes from any other origin.
#
# Single sign-on with an existing Keycloak (or any OIDC provider) is off
# unless OMS_OIDC_ISSUER is set; pass the OMS_OIDC_* variables to make lan.
# See docs/SSO.md.

x-app-env: &app-env
  OMS_DATABASE_URL: postgres://oms:oms@postgres:5432/oms?sslmode=disable
  OMS_BASE_URL: ${OMS_BASE_URL:?set OMS_BASE_URL to the address people will use}
  OMS_SMTP_ADDR: mailpit:1025
  OMS_MAIL_FROM: oh-my-story <no-reply@oh-my-story.local>
  OMS_OIDC_ISSUER: ${OMS_OIDC_ISSUER:-}
  OMS_OIDC_DISCOVERY_URL: ${OMS_OIDC_DISCOVERY_URL:-}
  OMS_OIDC_CLIENT_ID: ${OMS_OIDC_CLIENT_ID:-}
  OMS_OIDC_CLIENT_SECRET: ${OMS_OIDC_CLIENT_SECRET:-}
  OMS_OIDC_NAME: ${OMS_OIDC_NAME:-}
  OMS_OIDC_DIRECTORY: ${OMS_OIDC_DIRECTORY:-}

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      # Reachable only inside this compose network.
      POSTGRES_USER: oms
      POSTGRES_PASSWORD: oms
      POSTGRES_DB: oms
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oms -d oms"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: ../..
    image: localhost/oh-my-story:lan
    command: ["migrate"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    image: localhost/oh-my-story:lan
    command: ["serve"]
    environment: *app-env
    ports:
      - "127.0.0.1:8090:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/oh-my-story", "healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 12

  mailpit:
    image: docker.io/axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:8026:8025"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
