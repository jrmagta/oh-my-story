openapi: "3.1.0"
info:
  title: "oh-my-story API"
  version: "1.0.0"
  license:
    name: "All rights reserved; not open source"
    url: "https://github.com/jrmagta/oh-my-story/blob/main/LICENSE"
  description: "The HTTP API the oh-my-story web app uses, open to scripts with an API token.\n\nScripts send `Authorization: Bearer oms_…`, made by an admin in Settings → API tokens. A token works on its own workspace's `/api/workspaces/{slug}/…` endpoints only: a read token as a viewer, a write token as an editor. The web app uses the session cookie instead.\n\nEvery request with a body sends `Content-Type: application/json`. Errors are `{\"error\": {\"code\", \"message\"}}`. Ids from another workspace, and malformed ids, answer 404. See docs/API.md for the rules behind each endpoint."
servers:
  - url: "/"
    description: "This server"
security:
  - bearerToken: []
  - sessionCookie: []
paths:
  /api/setup:
    get:
      tags: ["Account"]
      summary: "Whether the server needs its first user"
      operationId: getSetup
      description: "No sign-in needed."
      security: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  needsBootstrap:
                    type: "boolean"
                required: ["needsBootstrap"]
                additionalProperties: false
    post:
      tags: ["Account"]
      summary: "Create the first user (only while there are none) and sign in"
      operationId: postSetup
      description: "No sign-in needed."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                email:
                  type: "string"
                displayName:
                  type: "string"
                password:
                  type: "string"
              required: ["email", "displayName", "password"]
              additionalProperties: false
      responses:
        "201":
          description: "Created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "410":
          $ref: "#/components/responses/Gone"
  /api/auth/login:
    post:
      tags: ["Account"]
      summary: "Sign in with email and password"
      operationId: postAuthLogin
      description: "No sign-in needed."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                email:
                  type: "string"
                password:
                  type: "string"
              required: ["email", "password"]
              additionalProperties: false
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/auth/logout:
    post:
      tags: ["Account"]
      summary: "Sign out"
      operationId: postAuthLogout
      description: "A signed-in person (session cookie); API tokens are refused."
      security:
        - sessionCookie: []
      responses:
        "204":
          description: "Done"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/auth/providers:
    get:
      tags: ["Account"]
      summary: "Sign-in options"
      operationId: getAuthProviders
      description: "No sign-in needed."
      security: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  oidc:
                    type: "object"
                    properties:
                      enabled:
                        type: "boolean"
                      name:
                        type: "string"
                    required: ["enabled"]
                    additionalProperties: false
                required: ["oidc"]
                additionalProperties: false
  /api/auth/reset:
    post:
      tags: ["Account"]
      summary: "Ask for a password reset email (always 204)"
      operationId: postAuthReset
      description: "No sign-in needed."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                email:
                  type: "string"
              required: ["email"]
              additionalProperties: false
      responses:
        "204":
          description: "Done"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/auth/reset/{token}:
    get:
      tags: ["Account"]
      summary: "The account a reset link is for"
      operationId: getAuthResetToken
      description: "No sign-in needed."
      security: []
      parameters:
        - $ref: "#/components/parameters/token"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  email:
                    type: "string"
                required: ["email"]
                additionalProperties: false
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
    post:
      tags: ["Account"]
      summary: "Set a new password with a reset link, and sign in"
      operationId: postAuthResetToken
      description: "No sign-in needed."
      security: []
      parameters:
        - $ref: "#/components/parameters/token"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                password:
                  type: "string"
              required: ["password"]
              additionalProperties: false
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
  /api/me:
    get:
      tags: ["Account"]
      summary: "The signed-in user and their workspaces"
      operationId: getMe
      description: "A signed-in person (session cookie); API tokens are refused."
      security:
        - sessionCookie: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  workspaces:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/Membership"
                required: ["user", "workspaces"]
                additionalProperties: false
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/invites/{token}:
    get:
      tags: ["Account"]
      summary: "What an invite is for"
      operationId: getInvitesToken
      description: "No sign-in needed."
      security: []
      parameters:
        - $ref: "#/components/parameters/token"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  workspaceName:
                    type: "string"
                  email:
                    type: "string"
                  role:
                    type: "string"
                    enum: ["viewer", "commenter", "editor", "admin", "owner"]
                required: ["workspaceName", "email", "role"]
                additionalProperties: false
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
  /api/invites/{token}/accept:
    post:
      tags: ["Account"]
      summary: "Accept an invite: signed in with its email, or with a new account"
      operationId: postInvitesTokenAccept
      description: "No sign-in needed."
      security: []
      parameters:
        - $ref: "#/components/parameters/token"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                displayName:
                  type: "string"
                password:
                  type: "string"
              additionalProperties: false
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  workspace:
                    $ref: "#/components/schemas/Workspace"
                required: ["workspace"]
                additionalProperties: false
        "201":
          description: "Created"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  workspace:
                    $ref: "#/components/schemas/Workspace"
                  user:
                    $ref: "#/components/schemas/User"
                required: ["workspace", "user"]
                additionalProperties: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
  /api/shared/{token}:
    get:
      tags: ["Share links"]
      summary: "A map behind a share link, read-only, without an account"
      operationId: getSharedToken
      description: "No sign-in needed."
      security: []
      parameters:
        - $ref: "#/components/parameters/token"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedMap"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/workspaces:
    get:
      tags: ["Workspaces"]
      summary: "My workspaces"
      operationId: getWorkspaces
      description: "A signed-in person (session cookie); API tokens are refused."
      security:
        - sessionCookie: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/Membership"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      tags: ["Workspaces"]
      summary: "Create a workspace; the caller becomes its owner"
      operationId: postWorkspaces
      description: "A signed-in person (session cookie); API tokens are refused."
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                name:
                  type: "string"
                slug:
                  type: "string"
                keyPrefix:
                  type: "string"
              required: ["name", "slug"]
              additionalProperties: false
      responses:
        "201":
          description: "Created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/project-keys:
    get:
      tags: ["Workspaces"]
      summary: "Suggest a free project key for a name, and check one"
      operationId: getProjectKeys
      description: "A signed-in person (session cookie); API tokens are refused."
      security:
        - sessionCookie: []
      parameters:
        - name: "name"
          in: query
          schema:
            type: "string"
        - name: "key"
          in: query
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  suggestion:
                    type: "string"
                  available:
                    type: "boolean"
                required: ["suggestion"]
                additionalProperties: false
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/workspaces/{slug}:
    get:
      tags: ["Workspaces"]
      summary: "A workspace, with the caller's role"
      operationId: getWorkspacesSlug
      description: "Viewer or above, or any API token."
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: ["Workspaces"]
      summary: "Change name, project key or estimate unit"
      operationId: patchWorkspacesSlug
      description: "Admin or above (not API tokens)."
      parameters:
        - $ref: "#/components/parameters/slug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                name:
                  type: "string"
                keyPrefix:
                  type: "string"
                estimateUnit:
                  type: "string"
              additionalProperties: false
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: ["Workspaces"]
      summary: "Delete the workspace"
      operationId: deleteWorkspacesSlug
      description: "Owner (not API tokens)."
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "204":
          description: "Done"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/workspaces/{slug}/members:
    get:
      tags: ["Members"]
      summary: "Members"
      operationId: getWorkspacesSlugMembers
      description: "Viewer or above, or any API token."
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/workspaces/{slug}/members/{userId}:
    patch:
      tags: ["Members"]
      summary: "Change a member's role"
      operationId: patchWorkspacesSlugMembersUserid
      description: "Admin or above (not API tokens)."
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/userId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                role:
                  type: "string"
                  enum: ["viewer", "commenter", "editor", "admin", "owner"]
              required: ["role"]
              additionalProperties: false
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: ["Members"]
      summary: "Remove a member, or leave"
      operationId: deleteWorkspacesSlugMembersUserid
      description: "Admin or above; any member may remove themselves."
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/userId"
      responses:
        "204":
          description: "Done"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/workspaces/{slug}/invites:
    get:
      tags: ["Members"]
      summary: "Open invites"
      operationId: getWorkspacesSlugInvites
      description: "Admin or above (not API tokens)."
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/Invite"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: ["Members"]
      summary: "Invite someone by email"
      operationId: postWorkspacesSlugInvites
      description: "Admin or above (not API tokens)."
      parameters:
        - $ref: "#/components/parameters/slug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                email:
                  type: "string"
                role:
                  type: "string"
                  enum: ["viewer", "commenter", "editor", "admin", "owner"]
              required: ["email", "role"]
              additionalProperties: false
      responses:
        "201":
          description: "Created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/workspaces/{slug}/invites/{id}:
    delete:
      tags: ["Members"]
      summary: "Revoke an invite"
      operationId: deleteWorkspacesSlugInvitesId
      description: "Admin or above (not API tokens)."
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: "Done"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/workspaces/{slug}/api-tokens:
    get:
      tags: ["API tokens"]
      summary: "API tokens, not revoked, newest first"
      operationId: getWorkspacesSlugApiTokens
      description: "Admin or above (not API tokens)."
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/ApiToken"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: ["API tokens"]
      summary: "Make an API token; the token is in this reply only"
      operationId: postWorkspacesSlugApiTokens
      description: "Admin or above (not API tokens)."
      parameters:
        - $ref: "#/components/parameters/slug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                name:
                  type: "string"
                scope:
                  type: "string"
                  enum: ["read", "write"]
                expiresInDays:
                  type: ["integer", "null"]
                  enum: [30, 90, 365, null]
              required: ["name", "scope"]
              additionalProperties: false
      responses:
        "201":
          description: "Created"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiToken"
                  - type: "object"
                    properties:
                      token:
                        type: "string"
                    required: ["token"]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/workspaces/{slug}/api-tokens/{id}:
    delete:
      tags: ["API tokens"]
      summary: "Revoke an API token"
      operationId: deleteWorkspacesSlugApiTokensId
      description: "Admin or above (not API tokens)."
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: "Done"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/workspaces/{slug}/workflows:
    get:
      tags: ["Workflows"]
      summary: "Workflows with their statuses, default first"
      operationId: getWorkspacesSlugWorkflows
      description: "Viewer or above, or any API token."
      parameters:
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/Workflow"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: ["Workflows"]
      summary: "Create a workflow with the standard four statuses"
      operationId: postWorkspacesSlugWorkflows
      description: "Admin or above (not API tokens)."
      parameters:
        - $ref: "#/components/parameters/slug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                name:
                  type: "string"
              required: ["name"]
              additionalProperties: false
      responses:
        "201":
          description: "Created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/workspaces/{slug}/workflows/{id}:
    patch:
      tags: ["Workflows"]
      summary: "Rename a workflow"
      operationId: patchWorkspacesSlugWorkflowsId
      description: "Admin or above (not API tokens)."
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                name:
                  type: "string"
              required: ["name"]
              additionalProperties: false
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/workspaces/{slug}/workflows/{id}/statuses:
    post:
      tags: ["Workflows"]
      summary: "Add a status"
      operationId: postWorkspacesSlugWorkflowsIdStatuses
      description: "Admin or above (not API tokens)."
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                name:
                  type: "string"
                category:
                  type: "string"
                  enum: ["todo", "doing", "done", "blocked"]
                colour:
                  type: ["string", "null"]
                  pattern: "^#[0-9A-Fa-f]{6}$"
                afterId:
                  type: ["string", "null"]
                  format: "uuid"
                beforeId:
                  type: ["string", "null"]
                  format: "uuid"
              required: ["name", "category"]
              additionalProperties: false
      responses:
        "201":
          description: "Created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/workspaces/{slug}/statuses/{id}:
    patch:
      tags: ["Workflows"]
      summary: "Change a status"
      operationId: patchWorkspacesSlugStatusesId
      description: "Admin or above (not API tokens)."
      parameters:
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                name:
                  type: "string"
                category:
                  type: "string"
                  enum: ["todo", "doing", "done", "blocked"]
                colour:
                  type: ["string", "null"]
                  pattern: "^#[0-9A-Fa-f]{6}$"
              additionalProperties: false
      responses:
        "200":
          description: "OK"
