components:
  securitySchemes:
    bearerToken:
      type: "http"
      scheme: "bearer"
      description: "A workspace API token, oms_…"
    sessionCookie:
      type: "apiKey"
      in: "cookie"
      name: "oms_session"
      description: "The web app's session."
  parameters:
    slug:
      name: "slug"
      in: "path"
      required: true
      description: "The workspace's URL slug."
      schema:
        type: "string"
    mapId:
      name: "mapId"
      in: "path"
      required: true
      description: "A map's id."
      schema:
        type: "string"
        format: "uuid"
    id:
      name: "id"
      in: "path"
      required: true
      description: "The item's id."
      schema:
        type: "string"
        format: "uuid"
    userId:
      name: "userId"
      in: "path"
      required: true
      description: "A member's user id."
      schema:
        type: "string"
        format: "uuid"
    token:
      name: "token"
      in: "path"
      required: true
      description: "The token from the link."
      schema:
        type: "string"
    before:
      name: "before"
      in: "query"
      description: "The next value from the previous page."
      schema:
        type: "integer"
    limit:
      name: "limit"
      in: "query"
      description: "1 to 200, default 50."
      schema:
        type: "integer"
        minimum: 1
        maximum: 200
  responses:
    BadRequest:
      description: "The request breaks a rule; the message says which."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: "No session, or a bad, revoked or expired token."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "The caller's role (or token) does not allow this."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "No such item in this workspace, or not a member."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: "Taken already, or the change would break a rule (such as removing the last owner)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Gone:
      description: "The link was used, replaced or has expired, or the server already has its first user."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: "object"
      properties:
        error:
          type: "object"
          properties:
            code:
              type: "string"
              enum: ["bad_request", "unauthenticated", "forbidden", "not_found", "conflict", "gone", "email_failed", "internal"]
            message:
              type: "string"
          required: ["code", "message"]
          additionalProperties: false
      required: ["error"]
      additionalProperties: false
    User:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        email:
          type: "string"
        displayName:
          type: "string"
      required: ["id", "email", "displayName"]
      additionalProperties: false
    Workspace:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        slug:
          type: "string"
        keyPrefix:
          type: "string"
        estimateUnit:
          type: "string"
      required: ["id", "name", "slug", "keyPrefix", "estimateUnit"]
      additionalProperties: false
    Membership:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        slug:
          type: "string"
        keyPrefix:
          type: "string"
        estimateUnit:
          type: "string"
        role:
          type: "string"
          enum: ["viewer", "commenter", "editor", "admin", "owner"]
      required: ["id", "name", "slug", "keyPrefix", "estimateUnit", "role"]
      additionalProperties: false
    Member:
      type: "object"
      properties:
        userId:
          type: "string"
          format: "uuid"
        email:
          type: "string"
        displayName:
          type: "string"
        role:
          type: "string"
          enum: ["viewer", "commenter", "editor", "admin", "owner"]
      required: ["userId", "email", "displayName", "role"]
      additionalProperties: false
    Invite:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        workspaceName:
          type: "string"
        email:
          type: "string"
